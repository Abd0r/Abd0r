<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 89 103" shape-rendering="crispEdges"><clipPath id="pavclip"><rect x="0" y="0" width="64" height="64" rx="8"/></clipPath><rect x="5" y="5" width="84" height="84" rx="16" fill="#00000022"/><polygon points="19,87 35,87 26,101" fill="#00000022"/><polygon points="14,82 30,82 21,96" fill="#FFFFFF" stroke="#00F5D4" stroke-width="4" stroke-linejoin="round"/><rect x="0" y="0" width="84" height="84" rx="16" fill="#FFFFFF" stroke="#00F5D4" stroke-width="4"/><rect x="18" y="80" width="8" height="8" fill="#FFFFFF"/><g transform="translate(10,10)" clip-path="url(#pavclip)">
  <!-- terminal window frame -->
  <g fill="#00F5D4">
    <rect x="8" y="6" width="48" height="46"/>
  </g>
  <!-- screen (dark inset) -->
  <g fill="#0A0D0C">
    <rect x="12" y="10" width="40" height="38"/>
  </g>
  <!-- title bar dots -->
  <g fill="#00F5D4">
    <rect x="14" y="12" width="3" height="3"/>
    <rect x="19" y="12" width="3" height="3"/>
    <rect x="24" y="12" width="3" height="3"/>
  </g>
  <!-- prompt line: > _ with cursor -->
  <g fill="#00F5D4">
    <rect x="14" y="20" width="3" height="3"/>
    <rect x="19" y="20" width="16" height="3"/>
  </g>
  <!-- agent output lines -->
  <g fill="#0B8A78">
    <rect x="14" y="27" width="10" height="3"/>
    <rect x="14" y="32" width="26" height="3"/>
    <rect x="14" y="37" width="18" height="3"/>
  </g>
  <!-- blinking cursor block -->
  <rect x="37" y="20" width="4" height="4" fill="#00F5D4">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <!-- spiky porcupine crown above the terminal -->
  <g fill="#00F5D4">
    <rect x="10" y="2" width="4" height="4"/>
    <rect x="16" y="0" width="4" height="4"/>
    <rect x="22" y="2" width="4" height="4"/>
    <rect x="28" y="0" width="4" height="4"/>
    <rect x="34" y="2" width="4" height="4"/>
    <rect x="40" y="0" width="4" height="4"/>
    <rect x="46" y="2" width="4" height="4"/>
    <rect x="52" y="0" width="4" height="4"/>
  </g>
  <!-- WoT link nodes (two agents) -->
  <g fill="#00F5D4">
    <rect x="10" y="56" width="5" height="5"/>
    <rect x="49" y="56" width="5" height="5"/>
  </g>
  <rect x="16" y="57" width="32" height="2" fill="#0B8A78"/>
  <rect x="17" y="57" width="2" height="2" fill="#00F5D4">
    <animate attributeName="x" values="17;45;17" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</g></svg>
